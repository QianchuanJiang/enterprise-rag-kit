# Qdrant 生产后端 · 信创Edge —— Qdrant 生产向量库一键起
# 数据落在 docker 卷 qdrant_storage，容器重启/重建不丢（持久化演示）。
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API（retriever 用）
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
