# 冒烟测试专用配置 —— 零网络 / 零模型 / 零失败
# 目标：在没有任何 GPU、模型权重、API key 的情况下，验证整条链路真实可用：
#   解析 → 切片 → 质检 → 向量化(fake) → 检索(BM25+RRF) → 生成(stub) → 溯源/拒答
#
# 关键开关：
#   retrieval.dense_model: fake        → Embedder 自动进入 hash 向量模式（无需 BGE-M3）
#   llm.provider: stub                  → 抽取式生成（无需智谱 / Ollama）
#   rerank_enabled / query_rewrite: false → 不依赖重排模型与 LLM 改写
#   refuse_threshold: 0.01             → 必须 >0（truthy），否则拒答分支永不触发
#   parser.engine: pymupdf             → .md/.txt 走纯 Python 解析器，不加载 docling
#
# 真实链路（智谱 GLM-4.7-Flash 免费档 + 本地 BGE-M3）见 configs/dev.yaml，需 API key / Ollama。
tenant: smoke
data_dir: ./data/smoke
collection: kb_smoke
qdrant_url: http://localhost:6333

parser:
  engine: pymupdf
  ocr: false
  drop_header_footer: true
  table_mode: kv_pairs

chunk:
  strategy: parent_child

retrieval:
  dense_model: fake          # 触发 Embedder 自动进入 fake 模式
  dense_dim: 256
  sparse: true
  top_k_coarse: 20
  top_k_final: 5
  rerank_enabled: false
  query_rewrite: false

guard:
  require_citation: true
  refuse_threshold: 0.01     # 必须 truthy，控制「无召回即拒答」分支
  max_context_chars: 4000
  injection_check: false

security:
  acl_enabled: false
  default_level: public
  audit_enabled: true
  audit_path: ./data/smoke/audit.jsonl

llm:
  provider: stub            # 零依赖抽取式生成
  base_url: http://localhost:11434/v1
  model: stub
  api_key_env: LLM_API_KEY
