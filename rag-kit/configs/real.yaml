# 真实链路配置（样例 A 第一批真实指标）
# 嵌入：本地 Ollama BGE-M3（零成本、数据不出本机）
# 生成：云端智谱 GLM-4.6V-Flash（多模态免费档，OpenAI 兼容）
# 检索：混合（稠密 BGE-M3 + BM25）→ RRF 融合 → 重排（本地无 reranker，自动降级为 RRF）
# 后端：memory（样例 A 阶段用内存向量；Qdrant 为样例 C 生产项）

tenant: real
data_dir: ./data/smoke          # 复用合成年报语料（2 份 .md）
collection: kb_real
qdrant_url: http://localhost:6333

parser:
  engine: markdown
  drop_header_footer: true
  table_mode: kv_pairs
  min_text_len: 30

chunk:
  strategy: parent_child
  child_size: 256
  parent_size: 768
  overlap: 32
  respect_headings: true

retrieval:
  dense_model: BAAI/bge-m3
  dense_dim: 1024
  sparse: true
  top_k_coarse: 30
  top_k_final: 8
  rerank_enabled: true
  rerank_model: BAAI/bge-reranker-v2-m3
  query_rewrite: false

guard:
  require_citation: true
  # 无据拒答阈值：经 8 家跨行业语料实测，相关分区间 [0.605,0.746] / 无关 [0.449,0.576]，
  # 数据标定建议 0.59（小语料 0.55 会漏拒部分无关 query）。
  refuse_threshold: 0.59
  max_context_chars: 12000
  injection_check: true

security:
  acl_enabled: false
  default_level: public
  audit_enabled: true
  audit_path: ./data/real/audit.jsonl

llm:
  provider: openai
  base_url: https://open.bigmodel.cn/api/paas/v4
  model: glm-4.6v-flash
  api_key_env: ZHIPU_API_KEY
  temperature: 0.1
  max_tokens: 1024
